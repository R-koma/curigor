<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eval annotate</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #dfe3e8;
        --text: #1b1f24;
        --muted: #6b7280;
        --accent: #2563eb;
        --pass: #047857;
        --fail: #b91c1c;
        --warn: #b45309;
        --warn-bg: #fef3c7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 320px 1fr;
        font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        font-size: 14px;
        color: var(--text);
        background: var(--bg);
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      aside {
        border-right: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .side-head {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      .side-head strong {
        display: block;
        margin-bottom: 8px;
      }
      .filters {
        display: flex;
        gap: 6px;
      }
      .filters button {
        flex: 1;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
      }
      .filters button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      #list {
        overflow-y: auto;
        flex: 1;
        padding: 8px 0 24px;
      }
      .session-label {
        display: flex;
        flex-direction: column;
        padding: 12px 14px 4px;
        font-size: 11px;
        color: var(--muted);
      }
      .session-topic {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }
      .record-id {
        margin: 0 0 14px;
        font-size: 12px;
        color: var(--muted);
        user-select: all;
      }
      .item {
        width: 100%;
        text-align: left;
        border: 0;
        border-left: 3px solid transparent;
        background: none;
        font: inherit;
        padding: 7px 14px;
        cursor: pointer;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .item:hover {
        background: #f1f5f9;
      }
      .item[aria-current="true"] {
        border-left-color: var(--accent);
        background: #eff6ff;
      }
      .item .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--line);
        flex: none;
      }
      .dot.pass {
        background: var(--pass);
      }
      .dot.fail {
        background: var(--fail);
      }
      main {
        overflow-y: auto;
        padding: 20px 24px 64px;
        min-width: 0;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .head-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: baseline;
        margin-bottom: 4px;
      }
      .head-row h1 {
        font-size: 17px;
        margin: 0;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .tag {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 9px;
        font-size: 11px;
        color: var(--muted);
      }
      .msg {
        padding: 9px 12px;
        border-radius: 8px;
        margin-bottom: 8px;
        white-space: pre-wrap;
        line-height: 1.7;
      }
      .msg.user {
        background: #eef2ff;
      }
      .msg.assistant {
        background: #f3f4f6;
      }
      .msg.last-user {
        background: #dbeafe;
        border: 1px solid var(--accent);
      }
      .role {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .output {
        white-space: pre-wrap;
        line-height: 1.8;
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 8px;
        padding: 12px;
      }
      dl.kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 14px;
        margin: 0;
      }
      dl.kv dt {
        color: var(--muted);
        font-size: 12px;
      }
      dl.kv dd {
        margin: 0;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 20px;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0 0 14px;
      }
      legend {
        padding: 0;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .segmented {
        display: flex;
        gap: 6px;
      }
      .segmented button {
        padding: 7px 14px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        font: inherit;
        cursor: pointer;
      }
      .segmented button[aria-pressed="true"][data-verdict="true"] {
        background: var(--pass);
        border-color: var(--pass);
        color: #fff;
      }
      .segmented button[aria-pressed="true"][data-verdict="false"] {
        background: var(--fail);
        border-color: var(--fail);
        color: #fff;
      }
      .segmented button[aria-pressed="true"][data-verdict="null"] {
        background: #4b5563;
        border-color: #4b5563;
        color: #fff;
      }
      select,
      textarea {
        width: 100%;
        font: inherit;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
      }
      select:disabled {
        background: #f3f4f6;
        color: var(--muted);
      }
      textarea {
        min-height: 110px;
        line-height: 1.7;
        resize: vertical;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .primary {
        padding: 9px 20px;
        border: 0;
        border-radius: 7px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .primary:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .assertion {
        border-top: 1px solid var(--line);
        padding: 9px 0;
      }
      .assertion:first-of-type {
        border-top: 0;
      }
      .assertion code {
        font-size: 12px;
        color: var(--muted);
      }
      .assertion p {
        margin: 3px 0 0;
        line-height: 1.65;
      }
      .echo {
        margin-bottom: 14px;
      }
      .echo summary {
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
        margin-bottom: 6px;
      }
      .echo .output,
      .echo .msg {
        max-height: 200px;
        overflow-y: auto;
      }
      .echo .msg {
        white-space: pre-wrap;
      }
      .segmented.verdicts {
        margin-top: 7px;
      }
      .segmented.verdicts button {
        padding: 3px 12px;
        font-size: 12px;
      }
      .segmented button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      input[type="text"] {
        width: 100%;
        font: inherit;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
      }
      .note-box {
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 12px;
        line-height: 1.7;
      }
      .note-box.warn {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .note-box.error {
        background: #fee2e2;
        color: var(--fail);
      }
      .note-box.info {
        background: #eff6ff;
        color: var(--accent);
      }
      .empty {
        color: var(--muted);
        padding: 40px 0;
        text-align: center;
      }
      kbd {
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 4px;
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <aside>
      <div class="side-head">
        <strong>eval annotate</strong>
        <div class="filters">
          <button type="button" data-filter="todo" aria-pressed="true">未 annotate</button>
          <button type="button" data-filter="all" aria-pressed="false">すべて</button>
        </div>
      </div>
      <div id="list"></div>
    </aside>

    <main>
      <div id="detail"><p class="empty">左の一覧からレコードを選んでください。</p></div>
    </main>

    <script>
      const state = { records: [], filter: "todo", current: null, detail: null, draft: null, promotion: null, relabel: null };

      const el = (tag, props = {}, children = []) => {
        const node = Object.assign(document.createElement(tag), props);
        for (const child of [].concat(children)) {
          if (child) node.append(child);
        }
        return node;
      };

      const api = async (path, options) => {
        const response = await fetch(path, options);
        const body = response.status === 204 ? null : await response.json();
        if (!response.ok) throw new Error(problemsOf(body) || `${response.status}`);
        return body;
      };

      const problemsOf = (body) => {
        const detail = body && body.detail;
        if (!detail) return "";
        if (typeof detail === "string") return detail;
        if (Array.isArray(detail)) return detail.map((d) => d.msg || JSON.stringify(d)).join(" / ");
        return (detail.problems || []).join(" / ");
      };

      async function loadList(selectId) {
        state.records = (await api("/api/records")).records;
        renderList();
        const target = selectId || state.current || (visibleRecords()[0] || {}).id;
        if (target) await openRecord(target);
      }

      function orderedRecords(records) {
        const sessionsWithTodo = new Set(records.filter((r) => !r.annotated).map((r) => r.session));
        const sessionRank = new Map();
        for (const record of records) {
          if (!sessionRank.has(record.session)) sessionRank.set(record.session, sessionRank.size);
        }
        const rank = (r) => (sessionsWithTodo.has(r.session) ? 0 : 1) * sessionRank.size + sessionRank.get(r.session);
        return [...records].sort(
          (a, b) => rank(a) - rank(b) || a.turn - b.turn || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0),
        );
      }

      function visibleRecords() {
        return orderedRecords(state.filter === "all" ? state.records : state.records.filter((r) => !r.annotated));
      }

      function renderList() {
        const list = document.getElementById("list");
        list.replaceChildren();
        const records = visibleRecords();
        if (!records.length) {
          list.append(el("p", { className: "empty", textContent: "該当なし" }));
          return;
        }
        let session = null;
        for (const record of records) {
          if (record.session !== session) {
            session = record.session;
            list.append(
              el("div", { className: "session-label" }, [
                el("span", { className: "session-topic", textContent: record.topic || "（トピック不明）" }),
                el("span", { textContent: session }),
              ]),
            );
          }
          const dot = el("span", { className: "dot" });
          if (record.pass === true) dot.classList.add("pass");
          if (record.pass === false) dot.classList.add("fail");
          const item = el("button", { type: "button", className: "item" }, [
            dot,
            el("span", { className: "name", textContent: `t${record.turn} · ${record.id}` }),
            el("span", { className: "meta", textContent: record.source }),
          ]);
          if (record.id === state.current) item.setAttribute("aria-current", "true");
          item.addEventListener("click", () => openRecord(record.id));
          list.append(item);
        }
      }

      async function openRecord(id) {
        state.current = id;
        state.detail = await api(`/api/records/${encodeURIComponent(id)}`);
        const record = state.detail.record;
        state.draft = {
          verdict: record.pass,
          first_failure: record.first_failure,
          note: record.note || "",
          message: null,
        };
        state.relabel = {
          human_verdicts: { ...state.detail.promoted_verdicts },
          message: null,
        };
        state.promotion = {
          failure_mode: record.first_failure || Object.keys(state.detail.assertions)[0] || null,
          human_verdicts: {},
          rationale: record.note || "",
          verified_by: state.detail.default_verified_by || "",
          open: false,
          message: null,
        };
        renderList();
        renderDetail();
      }

      function renderDetail() {
        const { record, conversation_history, output, turn_decision, graph_state, depth_map } = state.detail;
        const root = document.getElementById("detail");
        root.replaceChildren(
          readingCard(record, conversation_history, output),
          depth_map ? mapCard(depth_map) : decisionCard(turn_decision, graph_state),
          formCard(record),
          promotionCard(record),
        );
      }

      function readingCard(record, history, output) {
        const lastUserIndex = history.map((m) => m.role).lastIndexOf("user");
        const messages = history.map((message, index) =>
          el("div", { className: `msg ${message.role}${index === lastUserIndex ? " last-user" : ""}` }, [
            el("span", {
              className: "role",
              textContent: message.role === "user" ? "ユーザー" : "AI",
            }),
            document.createTextNode(message.content),
          ]),
        );
        const meta = record.meta || {};
        return el("section", { className: "card" }, [
          el("div", { className: "head-row" }, [
            el("h1", { textContent: record.topic || "（トピック不明）" }),
            el("span", { className: "tag", textContent: record.source }),
            record.promoted_to
              ? el("span", { className: "tag", textContent: `golden: ${record.promoted_to}` })
              : null,
            el("span", {
              className: "meta",
              textContent: [meta.model, meta.prompt_version, meta.prompt_fingerprint]
                .filter(Boolean)
                .join(" · "),
            }),
          ]),
          el("p", { className: "record-id", textContent: `${record.id} · t${record.turn}` }),
          el("h2", { textContent: "会話履歴" }),
          el("div", {}, messages),
          el("h2", { textContent: "評価対象の AI 応答" }),
          el("div", { className: "output", textContent: output }),
        ]);
      }

      function decisionCard(decision, graphState) {
        const rows = [];
        const add = (label, value) => {
          if (value === undefined || value === null || value === "") return;
          rows.push(el("dt", { textContent: label }), el("dd", { textContent: value }));
        };
        if (decision) {
          add("response_mode", decision.response_mode);
          add("selected_aspect", decision.selected_aspect);
          add("error_summary", decision.error_summary);
          add("covered_aspects（merge 後）", formatAspects(decision.covered_aspects));
        }
        add("covered_aspects（生成直前）", formatAspects((graphState || {}).covered_aspects));
        add("turn_count", (graphState || {}).turn_count);
        if (!rows.length) return el("div");
        return el("section", { className: "card" }, [
          el("h2", { textContent: "事前分析の決定（このターンがプロンプトへ注入した値）" }),
          el("dl", { className: "kv" }, rows),
        ]);
      }

      function mapCard(view) {
        const labels = view.stage_labels;
        const stageText = (stage) => (stage ? labels[stage] || stage : "未到達");
        const decision = view.decision;
        const aspectName = (id) => (view.aspects.find((a) => a.id === id) || {}).name || id;

        const rows = [];
        const add = (label, value) => {
          if (value === undefined || value === null || value === "") return;
          rows.push(el("dt", { textContent: label }), el("dd", { textContent: String(value) }));
        };
        if (decision) {
          add("response_mode", decision.response_mode);
          add(
            "selected_aspect",
            decision.selected_aspect_id ? `${aspectName(decision.selected_aspect_id)}（${decision.selected_aspect_id}）` : "",
          );
          add("has_misconception", decision.has_misconception);
          add("error_summary", decision.error_summary);
          add("wrap_up", decision.wrap_up ? "true（区切りの提案ターン）" : "false");
        }
        add("wrap_up_offered（生成直前）", view.wrap_up_offered);
        add("turn_count", view.turn_count);

        const aspectRows = view.aspects.map((aspect) => {
          const changed = aspect.stage_before !== aspect.stage_after;
          const stage = changed
            ? `${stageText(aspect.stage_before)} → ${stageText(aspect.stage_after)}`
            : stageText(aspect.stage_before);
          const row = el("div", { className: "assertion" }, [
            el("div", {}, [
              el("strong", { textContent: aspect.name }),
              document.createTextNode(" "),
              aspect.is_core ? el("span", { className: "tag", textContent: "中核" }) : null,
              aspect.added ? el("span", { className: "tag", textContent: "このターンで追加" }) : null,
              aspect.selected ? el("span", { className: "tag", textContent: "選ばれた観点" }) : null,
            ]),
            el("p", { className: "meta", textContent: `直前まで → このターン後: ${stage}` }),
            el("details", {}, [
              el("summary", { className: "meta", textContent: "段階ごとの核心の問い" }),
              el("p", { textContent: `defined: ${aspect.defined_question}` }),
              el("p", { textContent: `reasoned: ${aspect.reasoned_question}` }),
              el("p", { textContent: `applied: ${aspect.applied_question}` }),
            ]),
          ]);
          if (aspect.selected) row.style.background = "#eff6ff";
          return row;
        });

        return el("section", { className: "card" }, [
          el("h2", { textContent: "地図の到達度と事前分析の決定（このターンがプロンプトへ注入した値）" }),
          decision
            ? null
            : el("div", { className: "note-box warn", textContent: "事前分析なし（dialogue 以外の発話）。到達度は直前の値のまま。" }),
          rows.length ? el("dl", { className: "kv" }, rows) : null,
          decision && decision.injected_question
            ? el("div", { className: "note-box info", textContent: `注入された核心の問い（${decision.injected_stage} の問い）:${decision.injected_question}` })
            : null,
          el("h2", { textContent: "観点ごとの到達度" }),
          el("div", {}, aspectRows),
        ]);
      }

      const formatAspects = (aspects) =>
        Array.isArray(aspects) && aspects.length
          ? aspects.map((a) => `${a.aspect}: ${a.reached_depth}`).join(" / ")
          : "";

      function formCard(record) {
        const draft = state.draft;
        const card = el("section", { className: "card" });
        const boxes = [];

        if (draft.message) boxes.push(el("div", { className: `note-box ${draft.message.kind}`, textContent: draft.message.text }));

        const failingChecks = (state.detail.deterministic_outcomes || []).filter((o) => o.fails);
        if (draft.verdict === true && failingChecks.length) {
          boxes.push(
            el("div", {
              className: "note-box warn",
              textContent:
                "deterministic check は fail と判定しています: " +
                failingChecks.map((o) => `${o.assertion_id}/${o.check}（${o.detail}）`).join(", ") +
                "。criterion を読み直し、pass のままにするなら理由を note に書いてください。",
            }),
          );
        }
        if (record.promoted_to) {
          boxes.push(
            el("div", {
              className: "note-box info",
              textContent: `このレコードは golden（${record.promoted_to}）へ昇格済みです。pass は golden 側と一致させる必要があります。`,
            }),
          );
        }

        const verdictButtons = [
          { value: null, label: "未判断" },
          { value: true, label: "pass（良い応答）" },
          { value: false, label: "fail（失敗）" },
        ].map(({ value, label }) => {
          const button = el("button", { type: "button", textContent: label });
          button.dataset.verdict = String(value);
          button.setAttribute("aria-pressed", String(draft.verdict === value));
          button.addEventListener("click", () => {
            draft.verdict = value;
            if (value !== false) draft.first_failure = null;
            draft.message = null;
            renderDetail();
          });
          return button;
        });

        const select = el("select", { disabled: draft.verdict !== false });
        select.append(el("option", { value: "", textContent: "（未選択）" }));
        for (const mode of state.detail.failure_modes) {
          const option = el("option", { value: mode.key, textContent: `${mode.key} — ${mode.description}` });
          if (draft.first_failure === mode.key) option.selected = true;
          select.append(option);
        }
        select.addEventListener("change", () => {
          draft.first_failure = select.value || null;
          renderDetail();
        });

        const note = el("textarea", {
          placeholder: "どこがどう失敗しているか（または何が良いか）を一言で。assertion の言葉に寄せると golden の rationale に流用できます。",
          value: draft.note,
        });
        note.addEventListener("input", () => {
          draft.note = note.value;
        });

        const saveButton = el("button", { type: "button", className: "primary", textContent: "保存して次へ" });
        saveButton.addEventListener("click", () => save());

        const left = el("div", {}, [
          el("fieldset", {}, [el("legend", { textContent: "pass" }), el("div", { className: "segmented" }, verdictButtons)]),
          el("fieldset", {}, [
            el("legend", { textContent: "first_failure（pass=fail のときのみ）" }),
            select,
          ]),
          el("fieldset", {}, [el("legend", { textContent: "note" }), note]),
          el("div", { className: "actions" }, [
            saveButton,
            el("span", { className: "meta" }, [
              document.createTextNode("保存は "),
              el("kbd", { textContent: "⌘/Ctrl + Enter" }),
              document.createTextNode(
                record.annotated_at ? ` · 最終更新 ${record.annotated_at}` : " · 未 annotate",
              ),
            ]),
          ]),
        ]);

        const assertions = state.promotion && state.promotion.open ? null : state.detail.assertions[draft.first_failure];
        const right = el("div", {}, [
          el("h2", { textContent: assertions ? `${draft.first_failure} の assertion` : "assertion" }),
          assertions
            ? el(
                "div",
                {},
                assertions.map((assertion) =>
                  el("div", { className: "assertion" }, [
                    el("code", {
                      textContent: `${assertion.id} · ${assertion.type} · ${assertion.polarity}`,
                    }),
                    el("p", { textContent: assertion.criterion }),
                    assertion.applies_when
                      ? el("p", { className: "meta", textContent: `applies_when: ${assertion.applies_when}` })
                      : null,
                  ]),
                ),
              )
            : el("p", {
                className: "meta",
                textContent:
                  state.promotion && state.promotion.open
                    ? "assertion は下の昇格フォームに表示しています。"
                    : "first_failure を選ぶと、その失敗モードの assertion を表示します。",
              }),
        ]);

        card.append(...boxes, el("div", { className: "form-grid" }, [left, right]));
        return card;
      }

      function outputEcho() {
        const lastUser = [...state.detail.conversation_history].reverse().find((m) => m.role === "user");
        return el("details", { className: "echo", open: true }, [
          el("summary", { textContent: "直前のユーザー発話と評価対象の AI 応答" }),
          lastUser
            ? el("div", { className: "msg user last-user" }, [
                el("span", { className: "role", textContent: "ユーザー（直前）" }),
                document.createTextNode(lastUser.content),
              ])
            : null,
          el("div", { className: "output" }, [
            el("span", { className: "role", textContent: "AI 応答（評価対象）" }),
            document.createTextNode(state.detail.output),
          ]),
        ]);
      }

      function verdictRows(assertions, verdicts, onPick) {
        return assertions.map((assertion) => {
          const buttons = ["pass", "fail", "na"].map((verdict) => {
            const disabled = verdict === "na" && !assertion.applies_when;
            const button = el("button", {
              type: "button",
              textContent: verdict,
              disabled,
              title: disabled ? "applies_when を持たない assertion に na は付けられません" : "",
            });
            button.dataset.verdict = verdict === "na" ? "null" : String(verdict === "pass");
            button.setAttribute("aria-pressed", String(verdicts[assertion.id] === verdict));
            button.addEventListener("click", () => onPick(assertion.id, verdict));
            return button;
          });
          const label = [assertion.id, assertion.type, assertion.polarity];
          if (assertion.scope === "rubric") label.push("共通");
          return el("div", { className: "assertion" }, [
            el("code", { textContent: label.join(" · ") }),
            el("p", { textContent: assertion.criterion }),
            assertion.applies_when
              ? el("p", { className: "meta", textContent: `applies_when: ${assertion.applies_when}` })
              : null,
            el("div", { className: "segmented verdicts" }, buttons),
          ]);
        });
      }

      function relabelCard(record) {
        const relabel = state.relabel;
        const card = el("section", { className: "card" });
        card.append(el("h2", { textContent: `golden 昇格済み · ${record.promoted_to}.yaml` }));
        if (relabel.message) {
          card.append(el("div", { className: `note-box ${relabel.message.kind}`, textContent: relabel.message.text }));
        }
        card.append(
          el("p", {
            className: "meta",
            textContent:
              "human_verdicts だけ付け直せます。criterion・rationale の変更はエディタで行ってください（判定の基準そのものなので PR レビューを通す）。",
          }),
        );
        const assertions = state.detail.assertions[record.promoted_to] || [];
        const rows = verdictRows(assertions, relabel.human_verdicts, (id, verdict) => {
          relabel.human_verdicts[id] = verdict;
          relabel.message = null;
          renderDetail();
        });
        const save = el("button", { type: "button", className: "primary", textContent: "verdict を保存する" });
        save.addEventListener("click", () => saveVerdicts());
        const changed = assertions.some((a) => relabel.human_verdicts[a.id] !== state.detail.promoted_verdicts[a.id]);
        save.disabled = !changed;
        card.append(
          el("div", { className: "form-grid" }, [
            el("div", {}, [outputEcho(), el("div", { className: "actions" }, [save])]),
            el("div", {}, [el("h2", { textContent: "human_verdicts" }), el("div", {}, rows)]),
          ]),
        );
        return card;
      }

      async function saveVerdicts() {
        try {
          const result = await api(`/api/records/${encodeURIComponent(state.current)}/verdicts`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ human_verdicts: state.relabel.human_verdicts }),
          });
          await openRecord(state.current);
          state.relabel.message = { kind: "info", text: `${result.written_to} を更新しました。${result.next_step}` };
          renderDetail();
        } catch (error) {
          state.relabel.message = { kind: "error", text: `保存できません: ${error.message}` };
          renderDetail();
        }
      }

      function promotionCard(record) {
        const promotion = state.promotion;
        const card = el("section", { className: "card" });
        card.append(el("h2", { textContent: "golden へ昇格" }));

        if (record.promoted_to) {
          return relabelCard(record);
        }
        if (!record.annotated) {
          card.append(el("p", { className: "meta", textContent: "pass を決めると昇格できます。" }));
          return card;
        }
        if (!promotion.open) {
          const open = el("button", { type: "button", className: "primary", textContent: "昇格フォームを開く" });
          open.addEventListener("click", () => {
            promotion.open = true;
            renderDetail();
          });
          card.append(open);
          return card;
        }

        if (promotion.message) {
          card.append(el("div", { className: `note-box ${promotion.message.kind}`, textContent: promotion.message.text }));
        }

        const targets = Object.keys(state.detail.assertions);
        const select = el("select");
        for (const mode of targets) {
          const option = el("option", { value: mode, textContent: mode });
          if (promotion.failure_mode === mode) option.selected = true;
          select.append(option);
        }
        select.addEventListener("change", () => {
          promotion.failure_mode = select.value;
          promotion.human_verdicts = {};
          renderDetail();
        });

        const assertions = state.detail.assertions[promotion.failure_mode] || [];
        const rows = verdictRows(assertions, promotion.human_verdicts, (id, verdict) => {
          promotion.human_verdicts[id] = verdict;
          promotion.message = null;
          renderDetail();
        });

        const rationale = el("textarea", {
          placeholder: "なぜ失敗か（なぜ良いか）を人間の言葉で。instance 固有の事実はここに置き、criterion には書かない。",
          value: promotion.rationale,
        });
        rationale.addEventListener("input", () => {
          promotion.rationale = rationale.value;
        });

        const verifiedBy = el("input", { type: "text", value: promotion.verified_by });
        verifiedBy.addEventListener("input", () => {
          promotion.verified_by = verifiedBy.value;
        });

        const submit = el("button", { type: "button", className: "primary", textContent: "golden に追記する" });
        submit.addEventListener("click", () => promote());

        card.append(
          el("div", { className: "form-grid" }, [
            el("div", {}, [
              outputEcho(),
              el("fieldset", {}, [el("legend", { textContent: "昇格先の failure_mode" }), select]),
              el("fieldset", {}, [el("legend", { textContent: "rationale" }), rationale]),
              el("fieldset", {}, [el("legend", { textContent: "verified_by" }), verifiedBy]),
              el("div", { className: "actions" }, [
                submit,
                el("span", {
                  className: "meta",
                  textContent: `pass=${record.pass} は正本の値をそのまま写します`,
                }),
              ]),
            ]),
            el("div", {}, [el("h2", { textContent: "human_verdicts" }), el("div", {}, rows)]),
          ]),
        );
        return card;
      }

      async function promote() {
        const promotion = state.promotion;
        try {
          const result = await api(`/api/records/${encodeURIComponent(state.current)}/promote`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              failure_mode: promotion.failure_mode,
              human_verdicts: promotion.human_verdicts,
              rationale: promotion.rationale,
              verified_by: promotion.verified_by,
            }),
          });
          state.records = (await api("/api/records")).records;
          await openRecord(state.current);
          state.promotion.message = { kind: "info", text: `${result.written_to} に追記しました。${result.next_step}` };
          renderList();
          renderDetail();
        } catch (error) {
          promotion.message = { kind: "error", text: `昇格できません: ${error.message}` };
          renderDetail();
        }
      }

      async function save() {
        const draft = state.draft;
        try {
          await api(`/api/records/${encodeURIComponent(state.current)}/annotation`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              pass: draft.verdict,
              first_failure: draft.first_failure,
              note: draft.note,
            }),
          });
        } catch (error) {
          draft.message = { kind: "error", text: `保存できません: ${error.message}` };
          renderDetail();
          return;
        }
        const next = nextTodoId();
        state.records = (await api("/api/records")).records;
        await openRecord(next || state.current);
      }

      function nextTodoId() {
        const todo = orderedRecords(state.records).filter((r) => !r.annotated && r.id !== state.current);
        return todo.length ? todo[0].id : null;
      }

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          state.filter = button.dataset.filter;
          document.querySelectorAll("[data-filter]").forEach((other) => {
            other.setAttribute("aria-pressed", String(other.dataset.filter === state.filter));
          });
          renderList();
        });
      });

      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter" && state.current) {
          event.preventDefault();
          save();
        }
      });

      loadList().catch((error) => {
        document.getElementById("detail").replaceChildren(
          el("p", { className: "empty", textContent: `読み込みに失敗しました: ${error.message}` }),
        );
      });
    </script>
  </body>
</html>
