  graph/review_plan.py の並びで引き継ぎの次に置いた（REVIEW_PLAN_PROMPT_FINGERPRINT が c625a82e8e98 から動く）。
  graph/prompts/note.py の UPDATE_NOTE_PROMPT・APPEND_REVIEW_PROMPT に節の扱いを足した
  （REVIEW_NOTE_PROMPT_FINGERPRINT が 816365f21820 から動く。NOTE_PROMPT_FINGERPRINT は変わらない）
