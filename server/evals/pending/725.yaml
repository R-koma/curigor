issue: 725
summary: 地図の経路で、学習者がまだ触れていない核心の概念を応答が先に持ち出さないようにする。触れていない観点の深掘りは展開として組み立て、問いはその観点を表す言葉 1 つにする。「〜が無いと何が困るか」の〜は学習者が述べたものにし、触れていない仕組みの細部や、質問への答えで名前だけ挙げたものの性質を問わない
changed: graph/prompts/map_question.py（未出の概念の規則・触れていない観点の規則・核心の節の細部の規則・質問への回答の手順 5・_mode_for_aspect。MAP_PROMPT_FINGERPRINT が dd1bafa56988 から a00a167dd2c3 に動く）。旧経路（question.py）・事前分析・地図の生成は変えていない
note: >-
  全件の regression（--route map --runs 3、カスケード）1 回で全項目を照合する。比べる相手は baselines/map-v6-full.json（2047bbe3aa76）。
  v6 の後に #756 の表記のルール（dd1bafa56988）が入っており、その確認待ちの項目は無いので、この比較は #756 の変更も含む。
  v6 で fail した 5 回は 4 つの型に分かれる。A：触れていない観点で深掘りが選ばれ、核心の概念を前提に「〜が無いと何が困るか」と問う（ac9a171d__t8 の仮想メモリ・04d22b75__t6 の str.format）。
  B：触れていない観点の「知っていたら説明して」に核心の別の要素を足す（7f7c60c6__t12 の油絵具の「描き方」）。
  C：質問への答えで名前だけ挙げたものの違いを問う（7f7c60c6__t22 のテンペラ）。D：核心の問いの仕組みの細部をそのまま問う（ac9a171d__t6 のスケジューラの選択基準）。
  v6 の 3 回では、assumed の 4 instance が 8/12、preempted の 04d22b75__t6 が 2/3、assumed 全体の a1 が 11/15、preempted 全体の a1 が 8/9、全 assertion の pass が 113/123、r3 が 120/123。
  事前分析の response_mode は deepen のまま記録されるので、A の instance は turn_decision が deepen でも、応答は展開（言葉を知っているかを問う）の形になっているのが正しい。
  数で外れたら、まず人が読む項目で型ごとの応答を読み、同じ型が残っているか、別の原因（揺れ・#756 の表記のルール・judge）かを分ける。
  深くしすぎない副作用（触れた観点でも必要性や仕組みを問わなくなる）は deepen-kept-read で見る
