issue: 611
summary: 対話と記録のプロンプトに表記のルール（コードのフェンス・数式の $・金額の \$・図の可否）を足し、rubric に表記のチェック r5〜r8 を足した
changed: graph/prompts/_base.py（FORMATTING_RULES）と question.py・review.py・explore.py・synthesis.py・note.py・feedback.py。PROMPT_FINGERPRINT と MAP_PROMPT_FINGERPRINT が動く。evals/datasets/rubric/common.yaml に r5〜r8（決定的）
note: map-v4 は screen の judge だけ（--no-cascade）で取った記録なので、比べる実行もそろえる。今の golden に数式・金額・図が出る話題は無いので、r6〜r8 の全件 pass は悪化が無いことだけを示す。コードを使う話題は Python の f 文字列の 5 件で、表記は read の項目で読んで確かめる。数学・プログラミングの実セッションは capture しただけでは regression に入らない（regression は golden の instance だけを再生する）ので、annotate で golden に昇格させてから測る。インプット（explore.py）・ノート・フィードバック・学習メモは eval の対象外で、docs/note/session-verification-checklist.md の 8 節で手で確かめる
