issue: 502
summary: 地図の経路で、まだ口にしていない用語は名前と定義を先に述べず、知っていれば説明してもらう問いにする。送信前に、問いより前の文に答えの中核を書いていないか確かめる
changed: graph/prompts/map_question.py（共通ルールの新しい知識の補足・展開のモードの補足の指示と応答例・深掘りの未出の概念の規則・送信前の確認。MAP_PROMPT_FINGERPRINT が 46f81c2f62ba から 2ec014b2c769 に動く）。続けて、選んだ観点が map_covered に無いときの規則を足した（2047bbe3aa76）。旧経路（question.py）と事前分析は変えていない。golden assumed_unmentioned_concept の a1 に、用語を知っているかを確かめる問いは該当しないことを足し、手書きの正例 7f7c60c6__t12-exemplar を足した（generate_questions.jsonl にも）
note: 比べる相手は基準値 baselines/map-v5-full.json（カスケード）。基準値の fail は 10 回で、preempted の a1 8/9・assumed の a1 13/15・r3 119/123。改善の項目は基準値より良いことを求め、map-unchanged は全体が悪化していないことを確かめる。assumed の基準を変えたので、先に scoring で judge が正例を pass にするか（assumed-exemplar-a1）と校正ゲートを確かめる。regression は capture 由来のレコードだけを再生するので、手書きの正例は assumed-a1 の母数（15）に入らない
