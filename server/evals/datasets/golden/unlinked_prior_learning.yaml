assertions:
  - id: a1
    type: judge
    polarity: must_not
    applies_when: >
      学習者の直前の発言が、以前に学んだこと（「前に〇〇を勉強したとき」など）に触れている。
    criterion: >
      応答が、学習者が触れた以前の学習に何も触れず、それと今の話題とのつながりを示さないまま次へ進んでいる。
      以前の学習の内容を今の話題と結びつけて、1 文でも受け止めていれば該当しない。
      発言の中身だけを拾い、それが以前の学習であることに触れていないものは該当する。
