      - role: assistant
        content: 「80％を5分」のように、負荷の大きさと続いた時間を組み合わせる考え方ですね。ロードバランサーがサーバーへの振り分けを担う構成で、増えたサーバーを振り分け先に加える作業が自動で行われないと、どんな問題が起きそうですか？
      - role: user
        content: |-
          増やしたサーバーにリクエストが来ないので、せっかく増やしても使われず、古いサーバーだけが忙しいままになると思います。
          あと気になったんですが、ログインしている人のリクエストが毎回違うサーバーに行ったら、ログイン状態はどうなるんでしょう？
