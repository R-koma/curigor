        content: ログイン状態が毎回違うサーバーに行ったときどうなるか、という疑問ですね。ログイン後の状態を各サーバーがそれぞれ別々に持っている場合を考えてみましょう。あるリクエストが前回とは別のサーバーに届いたとき、そのサーバーはログイン中だと判断できるでしょうか？
      - role: user
        content: |-
          判断できないと思います。そのサーバーはログインの情報を持っていないので、もう一度ログインしてくださいとなりそう。
          同じ人のリクエストは、いつも同じサーバーに送るようにすれば解決できますか？
