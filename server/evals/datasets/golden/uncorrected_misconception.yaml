assertions:
  - id: a1
    type: judge
    polarity: must_not
    applies_when: >
      ユーザーの直前の説明に、訂正を要する誤りまたは混同（手段と結果の取り違え、
      問いの一部だけで全体に答える等）が含まれている。
    criterion: >
      ユーザー発言に含まれる不正確な表現を、訂正も指摘もしないまま次の質問・次の話題へ進んでいる。
      明示的に追認・復唱する場合も、触れずに通り過ぎる場合も、これに含む。
      誤りの一部でも訂正・指摘していれば、これに含まない。
  - id: a2
    type: judge
    polarity: must
    criterion: >
      ユーザー発言の誤りを訂正し、その訂正した知識を使う具体的な問いで理解を確認している。
      新しい事例への適用・分類・判断や、仕組みの説明を求める質問を含み、訂正文の再説明は必須ではない。
      訂正を行っていない場合、または訂正した知識に関係のない質問だけの場合は含まない。
      問いの答えを既に示しているかは、この項目ではなく r3 で判定する。
  - id: a3
    type: judge
    polarity: must_not
    applies_when: >
      ユーザーの直前の説明に、訂正を要する誤りまたは混同（手段と結果の取り違え、
      問いの一部だけで全体に答える等）が含まれている。
    criterion: >
      応答が、誤りを指摘・訂正する前に、またはそれに代えて、ユーザーの説明全体を肯定・称賛する前置き
      （「整理していますね」「良い説明ですね」「重要なポイントを押さえていますね」など）を置いている。
      説明のうち正しい部分を具体的に挙げて受け止めるもの（「〜という書き方は合っています」）や、
      ユーザーが使った言葉・説明しようとした対象を挙げるだけのもの（「〜についての説明ですね」）は該当しない。
