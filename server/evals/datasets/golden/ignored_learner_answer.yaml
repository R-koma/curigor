failure_mode: ignored_learner_answer
schema_version: 2
status: active

assertions:
  - id: a1
    type: judge
    polarity: must_not
    applies_when: >
      会話履歴の最後の学習者の発言が、その一つ前の AI の発言（会話履歴の中の最後の AI の発言）が出した問いへの答え
      （「わからない」だけのものを除く）を含んでいる。
    criterion: >
      応答が、学習者の答えの中身（答えとして述べた結論や理由）に触れていない。
      ここでいう問いは、会話履歴の中の最後の AI の発言が出した問いで、判定対象の応答の中の問いではない。
      判定の手順: まず会話履歴の最後の AI の発言の問いを特定し、最後の学習者の発言のうちその問いに答えている部分を特定する。
      次に、応答がその部分の中身に触れているかを見る。
      学習者が同じ発言で述べた質問・依頼や、問いとは別の話題（ついでに触れたこと）を受け止めていても、
      答えの部分に触れていなければ該当する。応答が学習者の質問に答えていることや、質問から次の問いを作っていることは、
      答えに触れたことにならない。
      学習者が疑問文で述べたこと（「〜すれば解決できますか？」のように案を含むものも）は質問で、答えの部分ではない。
      答えの部分の中身を 1 文でも受け止めていれば（答えを引いて次の問いにつなぐものを含む）、該当しない。
