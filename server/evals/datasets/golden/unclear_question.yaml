assertions:
  - id: a1
    type: judge
    polarity: must_not
    criterion: >
      応答の問いを一度読んだだけでは、何を答えればよいかが分からない。
      文の組み立てが崩れていて、問いとして成り立っていないもの（選ぶ候補を示さずに「どちらか」と聞く、など）を含む。
      文法は正しくても、何と何を比べているのか、何を答えればよいのかを、読み手が組み立て直さないと分からないもの
      （「〜と比べて、〜では何が変わるか」のような回りくどい言い方）も含む。
      問いが長いことや、専門用語を含むことだけでは該当しない。
