            is_core: false
            defined_question: システムコールとは何で、アプリケーションとLinuxカーネルの間でどのような役割を担うか？
            reasoned_question: なぜアプリケーションはハードウェアやカーネルの機能を直接操作せず、システムコールを通じて要求するのか？
            applied_question: アプリケーションがファイルを開く、プロセスを作るなどの処理を行うとき、システムコールをどう位置づけて説明できるか？
