assertions:
  - id: a1
    type: judge
    polarity: must_not
    criterion: >
      応答の問いに答えるには、ユーザーがこれまでの発言で述べておらず、応答の中でも説明されていない
      専門的な概念・用語・手法の知識が要る。
      問いが「どう両立できるか」のように方法を問い、答えるにはその分野の具体的なやり方（例: 段階的なリリース）を
      知っている必要がある場合も該当する。
      日常の経験から答えられる問い、ユーザーが述べた内容から考えられる問い、応答の中で説明した内容を使って答えられる問いは該当しない。
      ユーザーがまだ述べていない用語について、その言葉を知っているかと、知っていればそれが何かだけを尋ねる問いは該当しない。
      その用語の性質・働き・使い道を問う場合は、この除外に当たらない。
