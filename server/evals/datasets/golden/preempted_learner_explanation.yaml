assertions:
  - id: a1
    type: judge
    polarity: must_not
    criterion: >
      応答が、学習者にこれから考えさせる・説明させる内容（概念の名前と定義、対比、理由、利点）を、
      問いの前に AI 自身が先に述べている。
      学習者がまだ口にしていない用語を導入するときに、学習者がその用語を知っているかを問わずに、
      名前と定義を先に述べる場合も該当する。
      学習者が質問した・説明を求めた・「わからない」と答えた直後に、求められた範囲を説明することは該当しない。
      学習者がすでに述べた内容を受け止めることや、誤りを訂正することも該当しない。
