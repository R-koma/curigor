assertions:
  - id: a3
    type: judge
    polarity: must
    criterion: >
      質問が掘り下げようとしている対象が、ユーザーがまだ説明していない側面（仕組み・具体例・因果など）1つに限られている。
      数えるのは問いが指す先であって、質問文の数ではない。
      「これら」「それ」などの指示語は、指している先まで戻して数える。
      問う相手が複数（「これらの方法は」）でも、問う切り口が複数（「仕組みや条件は」）でも、対象は1つに限られていない。
  - id: a4
    type: judge
    polarity: must_not
    applies_when: >
      ユーザーの直前の説明に、訂正を要する事実誤認が含まれている。
    criterion: >
      ユーザー発言に含まれる不正確な表現を、訂正せずそのまま追認・復唱している。
