      AI は振り分け方法（ラウンドロビン・最短応答時間・ハッシュによるパーティショニング）を列挙した
      上で「振り分けの最適化のポイントは、負荷のバランスとレスポンス時間の最小化です」と述べ、その
      直後に「これらの振り分け方法がパフォーマンスにどう影響すると思いますか」と問うている。
      問いの答えは直前の一文そのものなので a1 は fail。

      a3 は、質問の対象が指示語「これらの」で 3 つの振り分け方法にまたがっているため fail。

      「わかりません」に対してヒントを出すこと自体は指導として妥当で、ここで問うているのは
      「出した後に、たった今述べた答えを聞いている」ことだけ。冒頭の「安心しました。」は文脈に
      合わないが、現行のどの assertion の守備範囲でもない。

      a3 は境界事例。3 つは同じ目的の代替手段で、切り口は「パフォーマンスへの影響」1 つなので、
      「比較として 1 問」と読む余地がある（Sonnet はこの読みで pass を返す。Haiku と Opus は fail）。
      fail を採ったのは 2026-09-17-0f43b9c0__t6 と揃えるため。あちらも指し先が複数・切り口が 1 つで、
      指し先の数で fail としている。同じ形（代替手段を 1 つの性質で比較させる問い）がもう 1 件出たら、
      a1 との二重計上になっていないかを含めて再検討する。
