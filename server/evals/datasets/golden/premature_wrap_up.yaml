    type: judge
    polarity: must_not
    applies_when: >
      ユーザーの直前の発言が、学習を終えたい・区切りたいことを伝えていない。
    criterion: >
      応答が、学習の中断・終了・ノートへのまとめを提案している。
      区切れることを事実として一言伝えたうえで、学習を続ける問いを出している場合は該当しない。
