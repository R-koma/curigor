            defined_question: Linuxにおけるプロセスとは何で、プログラムとどう違うか？
            reasoned_question: プログラムを実行すると、なぜそれをプロセスとして管理する必要があるのか。プロセスの生成・実行・終了はどのように進むのか？
            applied_question: プログラムの起動や終了を理解するために、プロセスの状態や親子関係をどのように確認・説明できるか？
          - id: プロセスのスケジューリング
            name: プロセスのスケジューリング
            is_core: true
            defined_question: Linuxのスケジューラとは何で、プロセスの実行順をどのように扱うものか？
            reasoned_question: 複数のプロセスが同時に実行を求めるとき、なぜCPUを順番に割り当てる必要があるのか。スケジューラは何を基準に実行対象を選ぶのか？
            applied_question: CPU使用率が高い、または処理が遅い状況を調べるとき、スケジューリングの仕組みをどう手がかりにできるか？
          - id: 仮想メモリ
            name: 仮想メモリ
            is_core: true
            defined_question: 仮想メモリとは何で、プロセスから見えるメモリ空間と物理メモリはどう関係するか？
            reasoned_question: なぜプロセスごとに独立した仮想アドレス空間を設けるのか。仮想アドレスを物理アドレスへ変換する仕組みは、保護やメモリ利用にどう役立つのか？
            applied_question: メモリ不足やプロセス間のメモリ分離を理解するとき、仮想メモリの仕組みをどう説明に使えるか？
          - id: ファイルシステムとストレージ
            name: ファイルシステムとストレージ
            is_core: true
            defined_question: Linuxのファイルシステムとは何で、ファイルやディレクトリをストレージ上でどう扱うか？
            reasoned_question: ストレージ上のデータを、なぜファイルやディレクトリという形で管理するのか。ファイルへのアクセスがストレージ上のデータに結びつく仕組みはどうなっているか？
            applied_question: ファイルが見つからない、またはストレージの空き容量が不足したとき、ファイルシステムの基本をどう調査に活用できるか？
          - id: システムコール
            name: システムコール
            is_core: false
            defined_question: システムコールとは何で、アプリケーションとLinuxカーネルの間でどのような役割を担うか？
            reasoned_question: なぜアプリケーションはハードウェアやカーネルの機能を直接操作せず、システムコールを通じて要求するのか？
            applied_question: アプリケーションがファイルを開く、プロセスを作るなどの処理を行うとき、システムコールをどう位置づけて説明できるか？
          - id: 仮想メモリとアプリの具体例
            name: 仮想メモリとアプリの具体例
            is_core: false
            defined_question: 仮想メモリとアプリの具体例を自分の言葉で定義できるか
            reasoned_question: 仮想メモリとアプリの具体例がなぜ必要か・どう成り立つかを説明できるか
            applied_question: 仮想メモリとアプリの具体例を学習ゴールに沿った場面で活かせるか
        map_covered:
        - aspect_id: プロセスと実行
          reached_stage: defined
        - aspect_id: プロセスのスケジューリング
          reached_stage: reasoned
        - aspect_id: 仮想メモリとアプリの具体例
          reached_stage: mentioned
