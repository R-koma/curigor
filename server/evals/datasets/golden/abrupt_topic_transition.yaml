      r1: pass
      r3: pass
      r2: pass
    rationale: 【下書きは Claude、確認は R-koma】CPUとカーネルの役割の質問には答えているが、つながりを示さずにファイル操作のシステムコールの問いへ移っている。学習者がまだ解決していない「見え方を分けるとなぜ触れなくなるか」にも戻っていない。
    verified_by: R-koma
