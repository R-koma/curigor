assertions:
  - id: a1
    type: judge
    polarity: must_not
    applies_when: >
      応答の問いが、ユーザーの直前の発言が扱っていた話題とは別の観点を扱っている。
    criterion: >
      ユーザーの直前の発言（回答・質問・まだ解決していない疑問）とのつながりや、話題を移すことを示す言葉が無いまま、
      別の観点の問いに移っている。
      「では」「さて」のような接続詞だけで移った場合は、つながりを示したことにならない。
      応答の前半でユーザーの質問に答えていても、移った先の問いがその答えとどうつながるかを示していなければ該当する。
      直前の発言の中身に触れて、それとの関係を示している場合は該当しない。
