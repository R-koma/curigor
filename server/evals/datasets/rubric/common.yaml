# failure_mode をまたいで全 golden instance に適用する共通 assertion（invariant）。
# id は golden 側のファイル内 id（a1, a2, ...）と衝突しないよう r 始まりにする。
schema_version: 1

assertions:
  - id: r1
    type: judge
    polarity: must_not
    applies_when: >
      ユーザーの直前の説明に、訂正を要する事実誤認が含まれていない。
    criterion: >
      ユーザーが自分の言葉で述べた内容を、AI が言い直したり補強したりして解説している。
      ユーザーがまだ述べていない内容を新たに渡すことは、これに含まない。
      名前を挙げただけの観点についても同じで、その中身を説明することは新たに渡すことにあたる。
      短い受け止めの復唱と、誤りを訂正するための記述も、これに含まない。
      応答に新しい内容が含まれていても、ユーザーが述べた内容を説明し直している部分があれば該当する。
      ユーザーの言葉を 1 文で短く引いて、次の説明や問いにつなぐだけのものは、短い受け止めの復唱にあたり、該当しない。
      ユーザーの説明のどこがなぜ良いかを示す文や、ユーザーの以前の発言・学習とのつながりを示す文も、
      ユーザーが述べた内容を説明し直していなければ、補強にあたらず、該当しない。
      該当する観点が1つでもあれば true。
  - id: r2
    type: deterministic
    check: contains_generic_prompt_phrase
    check_fingerprint: a9bd66a88432
    polarity: must_not
    criterion: >
      「もっと詳しく」「掘り下げてみませんか」のような定型句を含んでいる。
      促す対象を明示していても該当する。これらの句自体が、何を考えればよいかの手がかりを渡さないため。
  - id: r3
    type: judge
    polarity: must_not
    criterion: >
      AI が学習者に出した問いの答えの中核（結論・適用結果）を、そのAI応答自身が既に提示している。
      判定する問いはユーザーの元の質問ではなく、直近のAI応答が学習者に答えさせようとしている問いである。
      その問いより前に書かれた説明・数値・具体例も照合対象とする。
      説明した内容の抜き出しや言い換えだけを求める質問もこれに含む。
      一般則・定義・前提を教えた上で、新しい事例や条件への適用・分類・判断を求め、
      その事例への結論をまだ提示していない場合は含まない。
      教えた知識から答えを導けることや、答えに説明中と同じ用語が登場することだけでは該当しない。
      「これは X の代わりにはならない」のように、対比のためだけに他の選択肢や手段の名称を
      否定文で挙げている場合も、これだけでは該当しない。
      訂正や不知への説明でも、具体的な問いへの結論を先に示した場合は該当する。
  - id: r4
    type: deterministic
    check: contains_stock_praise
    check_fingerprint: 76460599f41e
    polarity: must_not
    criterion: >
      「完璧」「素晴らしい」「正解です」のような過剰な称賛や、「大丈夫ですよ」のような定型の励ましを含んでいる。
      ユーザーの説明の中身に触れていても該当する。称賛の大きさが説明の中身と釣り合わず、どこが良いかを伝えないため。
