[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.150.0",
    "langchain-anthropic>=1.7.5",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.16",
    "openai>=3.35.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg-binary>=3.3.6",
    "pyyaml>=6.0.2",
    "langfuse>=5.0.2",
    # 直接は使わないが langfuse.langchain が import する（.claude/rules/server/langfuse.md）
    "langchain>=1.4.4",
    "aiobotocore>=3.10.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.2",
    "botocore-stubs>=1.43.121",
    "freezegun>=1.5.0",
    "hypothesis>=6.170.2",
    "moto[s3,server]>=5.2.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.1",
    "types-aiobotocore[s3]>=3.10.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 75
omit = [
    "tests/*",
    "migrations/*",
    "alembic/*",
    "evals/*",
]

[tool.ruff]
line-length = 119
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "S",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S107", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.13"

warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",    
]

local_partial_types = true

plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "asyncpg",
    "asyncpg.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain.*",
    "langchain_openai.*",
    "langchain_anthropic.*",
    "langchain_core.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["freezegun.*"]
ignore_missing_imports = true
