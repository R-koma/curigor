[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.143.0",
    "langchain-anthropic>=1.4.6",
    "langchain-openai>=1.1.14",
    "langgraph>=1.0.10",
    "openai>=2.21.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.48",
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg-binary>=3.3.3",
    "pyyaml>=6.0.2",
    "langfuse>=4.14.1",
    # 直接は使わないが langfuse.langchain が import する（.claude/rules/server/langfuse.md）
    "langchain>=1.3.14",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.2",
    "freezegun>=1.5.0",
    "hypothesis>=6.169.4",
    "mypy>=2.4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.5",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 75
omit = [
    "tests/*",
    "migrations/*",
    "alembic/*",
    "evals/*",
]

[tool.ruff]
line-length = 119
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "S",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S107", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.13"

warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",    
]

local_partial_types = true

plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "asyncpg",
    "asyncpg.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain.*",
    "langchain_openai.*",
    "langchain_anthropic.*",
    "langchain_core.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["freezegun.*"]
ignore_missing_imports = true
