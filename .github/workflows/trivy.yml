name: Trivy

on:
  push:
    branches: [main]
    paths:
      - server/Dockerfile
      - server/pyproject.toml
      - server/uv.lock
      - .github/workflows/trivy.yml
  pull_request:
    branches: [main]
    paths:
      - server/Dockerfile
      - server/pyproject.toml
      - server/uv.lock
      - .github/workflows/trivy.yml
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE_REF: curigor-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag "$IMAGE_REF" server
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          ignore-unfixed: true
          format: json
          output: trivy.json
      # 以下の 2 段は上の結果を変換するだけ（再スキャンすると DB のキャッシュを復元し直し、古い DB で判定する）
      - name: Convert to SARIF for the Security tab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: convert
          scan-ref: trivy.json
          format: sarif
          output: trivy.sarif
          skip-setup-trivy: true
          cache: false
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-server-image
      - name: Fail on CRITICAL / HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: convert
          scan-ref: trivy.json
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-setup-trivy: true
          cache: false
