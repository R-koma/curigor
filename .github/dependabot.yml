version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Node のメジャーは client/.nvmrc・engines・CI・Dockerfile と揃えて手で上げる
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/server, /client]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      # Python は builder の uv イメージ・.python-version・requires-python と揃えて手で上げる
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
